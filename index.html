<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>カスタム HIIT タイマー</title>
    <style>
        :root {
            --bg-prepare: #1e293b;
            --bg-work: #7f1d1d;
            --bg-rest: #064e3b;
            --bg-complete: #312e81;
            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-prepare);
            color: #ffffff;
            height: 100vh;
            height: -webkit-fill-available;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: calc(var(--safe-top) + 12px) 20px calc(var(--safe-bottom) + 20px) 20px;
            transition: background-color 0.4s ease;
            overflow: hidden;
        }

        body.state-prepare { background-color: var(--bg-prepare); }
        body.state-work { background-color: var(--bg-work); }
        body.state-rest { background-color: var(--bg-rest); }
        body.state-complete { background-color: var(--bg-complete); }

        /* ヘッダー & プリセット切り替え */
        header {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            opacity: 0.9;
        }

        .header-btns {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.18);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.85rem;
            font-weight: 600;
            backdrop-filter: blur(10px);
            cursor: pointer;
        }

        /* プリセット選択バー */
        .preset-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.25);
            padding: 6px 10px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .preset-select {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 0.95rem;
            font-weight: 700;
            outline: none;
        }

        .preset-select option {
            background: #1e293b;
            color: white;
        }

        /* メインタイマー表示エリア */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            text-align: center;
        }

        .phase-badge {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            padding: 4px 18px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            margin-bottom: 8px;
        }

        .timer-display {
            font-size: 6rem;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            margin: 6px 0;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .total-time {
            font-size: 1rem;
            opacity: 0.85;
            font-weight: 600;
        }

        /* プログレスバー */
        .progress-container {
            width: 100%;
            margin-bottom: 16px;
        }

        .rounds-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 1rem;
            font-weight: 700;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: #ffffff;
            transition: width 0.3s linear;
        }

        /* コントロールボタン */
        .controls {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .btn {
            flex: 1;
            padding: 16px 0;
            border: none;
            border-radius: 16px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }

        .btn:active { transform: scale(0.96); }
        .btn-primary { background: #ffffff; color: #0f172a; }
        .btn-secondary { background: rgba(255, 255, 255, 0.2); color: #ffffff; backdrop-filter: blur(10px); }

        /* 設定モーダル */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.open { display: flex; }

        .modal-content {
            background: #0f172a;
            color: white;
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 16px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
            opacity: 0.8;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            outline: none;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
        }
    </style>
</head>
<body class="state-prepare">

    <header>
        <div class="header-top">
            <div class="title">INTERVAL TIMER</div>
            <div class="header-btns">
                <button id="soundToggle" class="icon-btn">🔊 ON</button>
                <button id="editPresetBtn" class="icon-btn">⚙️ 設定</button>
            </div>
        </div>
        <div class="preset-bar">
            <select id="presetSelect" class="preset-select"></select>
            <button id="newPresetBtn" class="icon-btn">＋ 追加</button>
        </div>
    </header>

    <main>
        <div id="phaseBadge" class="phase-badge">準備</div>
        <div id="timeDisplay" class="timer-display">00:05</div>
        <div id="totalTimeDisplay" class="total-time">残り総時間: 04:00</div>
    </main>

    <div class="progress-container">
        <div class="rounds-info">
            <span>SET</span>
            <span id="roundDisplay">0 / 8</span>
        </div>
        <div class="progress-bar-bg">
            <div id="progressBar" class="progress-bar-fill"></div>
        </div>
    </div>

    <div class="controls">
        <button id="resetBtn" class="btn btn-secondary">リセット</button>
        <button id="startBtn" class="btn btn-primary">スタート</button>
    </div>

    <!-- モーダル (設定作成・編集) -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">トレーニング設定</div>
            <div class="form-group">
                <label>トレーニング名</label>
                <input type="text" id="inputName" placeholder="例: タバタプロトコル">
            </div>
            <div class="form-group">
                <label>準備時間 (秒)</label>
                <input type="number" id="inputPrepare" min="0" value="5">
            </div>
            <div class="form-group">
                <label>運動時間 (秒)</label>
                <input type="number" id="inputWork" min="1" value="20">
            </div>
            <div class="form-group">
                <label>休憩時間 (秒)</label>
                <input type="number" id="inputRest" min="0" value="10">
            </div>
            <div class="form-group">
                <label>セット数 (回)</label>
                <input type="number" id="inputRounds" min="1" value="8">
            </div>
            <div class="modal-actions">
                <button id="deletePresetBtn" class="btn btn-delete" style="display:none;">削除</button>
                <button id="cancelModalBtn" class="btn btn-secondary">キャンセル</button>
                <button id="saveModalBtn" class="btn btn-primary">保存</button>
            </div>
        </div>
    </div>

    <script>
        // 初期標準プリセット
        const DEFAULT_PRESETS = [
            { id: 'default-1', name: 'タバタ (4分)', prepare: 5, work: 20, rest: 10, rounds: 8 },
            { id: 'default-2', name: '30秒/30秒 (4分)', prepare: 5, work: 30, rest: 30, rounds: 4 }
        ];

        // 状態変数
        let presets = [];
        let currentPreset = null;
        let isEditing = false;

        let isRunning = false;
        let isMuted = false;
        let currentPhase = 'PREPARE';
        let currentRound = 0;
        let phaseTimeRemaining = 0;
        let totalTimeRemaining = 0;

        let lastTimestamp = null;
        let animationFrameId = null;
        let wakeLock = null;

        // UIエレメント
        const bodyEl = document.body;
        const phaseBadge = document.getElementById('phaseBadge');
        const timeDisplay = document.getElementById('timeDisplay');
        const totalTimeDisplay = document.getElementById('totalTimeDisplay');
        const roundDisplay = document.getElementById('roundDisplay');
        const progressBar = document.getElementById('progressBar');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const soundToggle = document.getElementById('soundToggle');
        const presetSelect = document.getElementById('presetSelect');
        const editPresetBtn = document.getElementById('editPresetBtn');
        const newPresetBtn = document.getElementById('newPresetBtn');

        // モーダルエレメント
        const settingsModal = document.getElementById('settingsModal');
        const modalTitle = document.getElementById('modalTitle');
        const inputName = document.getElementById('inputName');
        const inputPrepare = document.getElementById('inputPrepare');
        const inputWork = document.getElementById('inputWork');
        const inputRest = document.getElementById('inputRest');
        const inputRounds = document.getElementById('inputRounds');
        const saveModalBtn = document.getElementById('saveModalBtn');
        const cancelModalBtn = document.getElementById('cancelModalBtn');
        const deletePresetBtn = document.getElementById('deletePresetBtn');

        // Web Audio API
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playBeep(freq = 440, type = 'sine', duration = 0.15) {
            if (isMuted || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function playCountdownBeep() { playBeep(600, 'sine', 0.12); }
        function playStartBeep() { playBeep(1200, 'triangle', 0.4); }
        function playCompleteBeep() {
            if (isMuted || !audioCtx) return;
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                setTimeout(() => playBeep(freq, 'triangle', 0.25), idx * 150);
            });
        }

        // Screen Wake Lock
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) {}
        }
        function releaseWakeLock() {
            if (wakeLock) { wakeLock.release().then(() => { wakeLock = null; }); }
        }

        // プリセット保存・読み込み
        function loadPresets() {
            const saved = localStorage.getItem('hiit_presets');
            if (saved) {
                presets = JSON.parse(saved);
            } else {
                presets = [...DEFAULT_PRESETS];
                savePresets();
            }
            renderPresetSelect();
            selectPreset(presets[0].id);
        }

        function savePresets() {
            localStorage.setItem('hiit_presets', JSON.stringify(presets));
        }

        function renderPresetSelect() {
            presetSelect.innerHTML = '';
            presets.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.textContent = `${p.name} (${formatTime(p.work * p.rounds + p.rest * (p.rounds - 1))})`;
                presetSelect.appendChild(opt);
            });
        }

        function selectPreset(id) {
            currentPreset = presets.find(p => p.id === id) || presets[0];
            presetSelect.value = currentPreset.id;
            resetTimer();
        }

        function getTotalWorkoutSec(p) {
            return p.rounds * p.work + (p.rounds - 1) * p.rest;
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function updateUI() {
            if (!currentPreset) return;
            timeDisplay.textContent = formatTime(Math.ceil(phaseTimeRemaining));
            totalTimeDisplay.textContent = `残り総時間: ${formatTime(Math.ceil(totalTimeRemaining))}`;
            roundDisplay.textContent = `${currentRound} / ${currentPreset.rounds}`;

            const totalSec = getTotalWorkoutSec(currentPreset);
            const overallProgress = totalSec > 0 ? ((totalSec - totalTimeRemaining) / totalSec) * 100 : 0;
            progressBar.style.width = `${Math.min(100, Math.max(0, overallProgress))}%`;

            bodyEl.className = `state-${currentPhase.toLowerCase()}`;

            if (currentPhase === 'PREPARE') phaseBadge.textContent = "準備";
            else if (currentPhase === 'WORK') phaseBadge.textContent = "運動 (WORK)";
            else if (currentPhase === 'REST') phaseBadge.textContent = "休憩 (REST)";
            else if (currentPhase === 'COMPLETE') {
                phaseBadge.textContent = "完了！";
                timeDisplay.textContent = "00:00";
            }
        }

        function tick(timestamp) {
            if (!isRunning) return;
            if (!lastTimestamp) lastTimestamp = timestamp;
            const delta = (timestamp - lastTimestamp) / 1000;
            lastTimestamp = timestamp;

            const prevSec = Math.ceil(phaseTimeRemaining);
            phaseTimeRemaining -= delta;

            if (currentPhase !== 'PREPARE' && currentPhase !== 'COMPLETE') {
                totalTimeRemaining = Math.max(0, totalTimeRemaining - delta);
            }

            const currentSec = Math.ceil(phaseTimeRemaining);
            if (prevSec !== currentSec && currentSec <= 3 && currentSec > 0) {
                playCountdownBeep();
            }

            if (phaseTimeRemaining <= 0) advancePhase();

            updateUI();
            if (isRunning) animationFrameId = requestAnimationFrame(tick);
        }

        function advancePhase() {
            if (currentPhase === 'PREPARE') {
                currentPhase = 'WORK';
                currentRound = 1;
                phaseTimeRemaining = currentPreset.work;
                playStartBeep();
            } else if (currentPhase === 'WORK') {
                if (currentRound >= currentPreset.rounds) {
                    currentPhase = 'COMPLETE';
                    totalTimeRemaining = 0;
                    isRunning = false;
                    startBtn.textContent = "スタート";
                    playCompleteBeep();
                    releaseWakeLock();
                    return;
                } else {
                    currentPhase = 'REST';
                    phaseTimeRemaining = currentPreset.rest;
                    playStartBeep();
                }
            } else if (currentPhase === 'REST') {
                currentPhase = 'WORK';
                currentRound++;
                phaseTimeRemaining = currentPreset.work;
                playStartBeep();
            }
        }

        function toggleStartPause() {
            initAudio();
            if (currentPhase === 'COMPLETE') resetTimer();

            isRunning = !isRunning;
            if (isRunning) {
                startBtn.textContent = "一時停止";
                lastTimestamp = null;
                requestWakeLock();
                animationFrameId = requestAnimationFrame(tick);
            } else {
                startBtn.textContent = "再開";
                releaseWakeLock();
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
            }
        }

        function resetTimer() {
            isRunning = false;
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            releaseWakeLock();

            if (currentPreset) {
                currentPhase = 'PREPARE';
                currentRound = 0;
                phaseTimeRemaining = currentPreset.prepare;
                totalTimeRemaining = getTotalWorkoutSec(currentPreset);
            }

            startBtn.textContent = "スタート";
            updateUI();
        }

        // モーダル操作
        function openModal(edit = false) {
            isEditing = edit;
            if (isEditing && currentPreset) {
                modalTitle.textContent = "設定を編集";
                inputName.value = currentPreset.name;
                inputPrepare.value = currentPreset.prepare;
                inputWork.value = currentPreset.work;
                inputRest.value = currentPreset.rest;
                inputRounds.value = currentPreset.rounds;
                deletePresetBtn.style.display = presets.length > 1 ? 'block' : 'none';
            } else {
                modalTitle.textContent = "新規トレーニング作成";
                inputName.value = "カスタム 4分";
                inputPrepare.value = 5;
                inputWork.value = 20;
                inputRest.value = 10;
                inputRounds.value = 8;
                deletePresetBtn.style.display = 'none';
            }
            settingsModal.classList.add('open');
        }

        function closeModal() {
            settingsModal.classList.remove('open');
        }

        function savePresetFromModal() {
            const name = inputName.value.trim() || '無題のトレーニング';
            const prepare = Math.max(0, parseInt(inputPrepare.value) || 0);
            const work = Math.max(1, parseInt(inputWork.value) || 1);
            const rest = Math.max(0, parseInt(inputRest.value) || 0);
            const rounds = Math.max(1, parseInt(inputRounds.value) || 1);

            if (isEditing && currentPreset) {
                currentPreset.name = name;
                currentPreset.prepare = prepare;
                currentPreset.work = work;
                currentPreset.rest = rest;
                currentPreset.rounds = rounds;
            } else {
                const newP = {
                    id: 'preset-' + Date.now(),
                    name, prepare, work, rest, rounds
                };
                presets.push(newP);
                currentPreset = newP;
            }

            savePresets();
            renderPresetSelect();
            selectPreset(currentPreset.id);
            closeModal();
        }

        function deleteCurrentPreset() {
            if (!currentPreset || presets.length <= 1) return;
            presets = presets.filter(p => p.id !== currentPreset.id);
            savePresets();
            renderPresetSelect();
            selectPreset(presets[0].id);
            closeModal();
        }

        // イベントリスナー設定
        startBtn.addEventListener('click', toggleStartPause);
        resetBtn.addEventListener('click', resetTimer);

        presetSelect.addEventListener('change', (e) => selectPreset(e.target.value));
        editPresetBtn.addEventListener('click', () => { resetTimer(); openModal(true); });
        newPresetBtn.addEventListener('click', () => { resetTimer(); openModal(false); });

        saveModalBtn.addEventListener('click', savePresetFromModal);
        cancelModalBtn.addEventListener('click', closeModal);
        deletePresetBtn.addEventListener('click', deleteCurrentPreset);

        soundToggle.addEventListener('click', () => {
            initAudio();
            isMuted = !isMuted;
            soundToggle.textContent = isMuted ? "🔇 OFF" : "🔊 ON";
        });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && isRunning) requestWakeLock();
        });

        // 初期ロード
        loadPresets();
    </script>
</body>
</html>
